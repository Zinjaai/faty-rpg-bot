version: "3.8"

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    environment:
      # Put the token in a .env file, not in the repo
      DISCORD_TOKEN: ${DISCORD_TOKEN}
    # Optional: persist logs / config if you need them
    # volumes:
    #   - ./logs:/bot/logs
